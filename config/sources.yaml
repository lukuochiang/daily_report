# 科技互联网每日一报 —— 数据源配置
# 所有来源独立请求、独立异常处理；单个来源失败不会影响整份日报。

settings:
  max_articles: 25          # 每日最多入库新闻数（控制 AI 成本）
  min_articles: 15          # 建议下限；新闻不足时允许少于此值，不补低价值内容
  request_timeout: 12       # 默认请求超时（秒）
  retry: 2                  # 默认失败重试次数
  user_agent: "Mozilla/5.0 (compatible; TechDailyBot/1.0; +https://daily.fs.kg)"
  hn_item_limit: 40         # 每个 HN 榜单最多读取的条目数
  github_window_days: 30    # GitHub 搜索：最近 N 天创建的高星仓库
  ai_batch_size: 25         # 单次 AI 请求处理的新闻条数

sources:
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    type: rss
    language: en
    categories: [business, companies]
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily

  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    type: rss
    language: en
    categories: [internet, companies]
    strict_relevance: true
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily

  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    type: rss
    language: en
    categories: [developers, security]
    strict_relevance: true
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily

  - name: WIRED
    url: https://www.wired.com/feed/rss
    type: rss
    language: en
    categories: [internet, ai]
    strict_relevance: true
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily

  - name: InfoQ 中文
    url: https://www.infoq.cn/feed.xml
    type: rss
    language: zh
    categories: [developers, companies]
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily

  - name: Hacker News (Top Stories)
    url: https://hacker-news.firebaseio.com/v0/
    type: hackernews
    language: en
    categories: [developers]
    strict_relevance: true
    enabled: true
    timeout: 12
    retries: 2
    frequency: daily
    lists: [topstories, newstories]

  - name: GitHub (Search-based Trending Proxy)
    url: https://api.github.com/search/repositories
    type: github_search
    language: en
    categories: [developers]
    enabled: true
    timeout: 15
    retries: 2
    frequency: daily
    params:
      q: "created:>{date} stars:>200"
      sort: stars
      order: desc
      per_page: 15
